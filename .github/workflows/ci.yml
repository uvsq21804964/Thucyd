name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit --pretty false

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://localhost:8080

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost/test
      INITIAL_ADMIN_PASSWORD: test-admin-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Generate test JWT keys
        run: |
          openssl genrsa -out jwt-private.pem 2048
          openssl rsa -in jwt-private.pem -pubout -out jwt-public.pem
          echo "JWT_PRIVATE_KEY=$(base64 -w 0 jwt-private.pem)" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY=$(base64 -w 0 jwt-public.pem)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        working-directory: .
        run: docker build -t thucyd-backend:test backend
